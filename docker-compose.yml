version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_techdesk_postgres
    environment:
      POSTGRES_USER: techdesk_user
      POSTGRES_PASSWORD: techdesk_password
      POSTGRES_DB: ai_techdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techdesk_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_techdesk_network

  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: ai_techdesk_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    entrypoint: /bin/sh -c "ollama serve & sleep 5 && ollama pull mistral && ollama pull nomic-embed-text && wait"
    networks:
      - ai_techdesk_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_techdesk_backend
    environment:
      DATABASE_URL: postgresql://techdesk_user:techdesk_password@postgres:5432/ai_techdesk
      JWT_SECRET_KEY: your-super-secret-key-change-in-production
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: mistral
      EMBEDDING_MODEL: nomic-embed-text
      ENVIRONMENT: development
      DEBUG: "False"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ai_techdesk_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_techdesk_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - ai_techdesk_network

volumes:
  postgres_data:
  ollama_data:

networks:
  ai_techdesk_network:
    driver: bridge
